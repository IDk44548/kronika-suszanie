<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kronika ZPiT Suszanie</title>
<meta name="description" content="Kronika Zespołu Pieśni i Tańca Suszanie – bale, występy, zgrupowania i wszystko, co przetańczyliśmy.">
<meta name="theme-color" content="#2f6b3d">
<meta name="color-scheme" content="light">
<meta property="og:title" content="Kronika ZPiT Suszanie">
<meta property="og:description" content="Bale, występy, zgrupowania – wszystko, co przetańczyliśmy.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5ee; --paper:#ffffff; --ink:#1f2a23; --muted:#66715f; --line:#e6e0d2;
  --green:#2f6b3d; --green-2:#e7f0e6; --red:#b8352b; --gold:#c4932f; --gold-2:#fbf1da;
  --radius:18px; --shadow:0 1px 2px rgba(31,42,35,.05),0 6px 24px rgba(31,42,35,.07);
  --top:calc(env(safe-area-inset-top) + 0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--green)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}

/* --- hero --- */
.hero{position:relative;text-align:center;padding:calc(env(safe-area-inset-top) + 36px) 20px 30px;
  background:radial-gradient(120% 90% at 50% 0%,#fff 0%,#f3efe2 70%,var(--bg) 100%);overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--red) 0 14px,var(--gold) 14px 20px,var(--green) 20px 34px,var(--gold) 34px 40px);opacity:.85}
.hero img{width:104px;height:auto;margin:0 auto 16px;filter:drop-shadow(0 10px 22px rgba(47,107,61,.22));mix-blend-mode:multiply}
.hero .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:600}
.hero h1{font-size:clamp(34px,10vw,52px);margin:6px 0 4px}
.hero p{margin:0 auto;color:var(--muted);max-width:30em}
.hero .stats{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.stat b{color:var(--ink)}

/* --- top bar --- */
.bar{position:sticky;top:0;z-index:20;background:rgba(248,245,238,.88);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 12px}
.years{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.years::-webkit-scrollbar{display:none}
.year-btn{flex:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);background:var(--paper);border:1px solid var(--line);transition:.2s}
.year-btn[aria-current="true"]{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 4px 14px rgba(47,107,61,.3)}
.menu-btn{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
.menu-btn svg{width:18px;height:18px}

/* --- content --- */
main{max-width:760px;margin:0 auto;padding:18px 14px 90px}
.year-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:12px 4px 16px}
.year-head h2{font-size:64px;color:var(--green);line-height:.9}
.year-head span{color:var(--muted);font-size:14px;text-align:right}
.cover{border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);background:var(--paper)}
.cover img{width:100%;height:auto;max-height:440px;object-fit:cover}
details.team{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;margin-bottom:22px}
details.team summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-weight:600}
details.team summary::-webkit-details-marker{display:none}
details.team summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:.2s;margin-right:4px}
details.team[open] summary::after{transform:rotate(-135deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 16px}
.chip{background:var(--green-2);color:#244f2f;border-radius:999px;padding:4px 11px;font-size:14px}

/* timeline */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--line),var(--line))}
.entry{position:relative;margin-bottom:18px;scroll-margin-top:84px}
.entry::before{content:"";position:absolute;left:-21px;top:24px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--gold)}
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:18px 18px 6px}
.date{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--red);background:#fbe9e6;border-radius:8px;padding:3px 9px;margin-bottom:8px}
.date.nodate{color:#7a5a17;background:var(--gold-2)}
.card h3{font-size:23px}
.card-body{padding:4px 18px 18px}
.card-body p{margin:10px 0 0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.card-body strong{font-weight:600}
.card.ghost{opacity:.5}
.vid{display:block;width:100%;max-height:75vh;margin-top:14px;border-radius:12px;background:#000}
.tag{align-self:center;font-size:12.5px;font-weight:600;color:#7a5a17;background:var(--gold-2);border-radius:8px;padding:3px 8px}
.card.collapsed .card-body{max-height:300px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.more{display:block;width:calc(100% - 36px);margin:0 18px 18px;padding:11px;border-radius:12px;background:var(--gold-2);color:#7a5a17;font-weight:600;font-size:15px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.gallery button{position:relative;border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:1}
.gallery button img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.gallery button:active img{transform:scale(1.04)}
.gallery.one{grid-template-columns:1fr}
.gallery.one button{aspect-ratio:auto}
.gallery.one button img{height:auto;max-height:520px}
.gallery.odd button:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gallery .plus{position:absolute;inset:0;display:grid;place-items:center;background:rgba(31,42,35,.55);color:#fff;font:700 26px Fraunces,serif}

.updated{text-align:center;color:var(--muted);font-size:13.5px;margin:34px 0 0}
.updated a{color:var(--muted)}
.next-year{display:block;margin:26px auto 0;padding:13px 22px;border-radius:999px;background:var(--green);color:#fff;font-weight:600}

/* toc drawer */
.scrim{position:fixed;inset:0;background:rgba(31,42,35,.35);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:86vh;z-index:41;background:var(--paper);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.15);
  padding-bottom:env(safe-area-inset-bottom);max-width:760px;margin:0 auto}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.drawer-top{padding:10px 16px 10px;border-bottom:1px solid var(--line)}
.grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.search{width:100%;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none}
.search:focus{border-color:var(--green);background:#fff}
.toc{overflow-y:auto;padding:6px 8px 20px;-webkit-overflow-scrolling:touch}
.toc h4{font:700 20px Fraunces,serif;color:var(--green);margin:16px 10px 4px}
.toc a{display:flex;gap:10px;align-items:baseline;padding:10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.toc a:active,.toc a:hover{background:var(--bg)}
.toc a small{flex:none;min-width:62px;color:var(--red);font-weight:600;font-size:13px}
.toc .empty{padding:20px;color:var(--muted);text-align:center}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:#0f1411;display:none;touch-action:pan-y}
.lb.show{display:block}
.lb-track{display:flex;height:100%;transition:transform .3s ease}
.lb-slide{flex:none;width:100%;height:100%;display:grid;place-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain}
.lb-ui{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600}
.lb-ui button,.lb-nav{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;font-size:22px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb-prev{left:12px}.lb-next{right:12px}
@media (hover:none){.lb-nav{display:none}}

/* tryb edycji */
.dev-bar{background:#fff7e0;border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;margin:6px 0 4px;font-size:14px;display:grid;gap:4px}
.dev-bar div{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.dev-bar button.primary{background:var(--green);color:#fff;border-color:var(--green)}
button.chip{font:inherit;font-size:14px;cursor:pointer}
.chip.add{background:var(--gold-2);color:#7a5a17;font-weight:600}
.edit-actions button.danger{color:var(--red);border-color:#f0c9c4}
.edit-actions.sticky{position:sticky;bottom:0;background:var(--paper);padding:10px 0 calc(12px + env(safe-area-inset-bottom));margin:0;border-top:1px solid var(--line)}
.form{display:grid;gap:10px;margin-bottom:12px}
.form label,.form .label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form small{font-weight:400;color:var(--muted)}
.form textarea{resize:vertical;min-height:140px;line-height:1.5}
.form select{appearance:auto}
.gallery button .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:13px}
.picker{grid-template-columns:repeat(3,1fr)!important;padding:0 6px}
.picker button{aspect-ratio:1!important;grid-column:auto!important}
.picker .tick{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);color:transparent;display:grid;place-items:center;font-weight:700}
.picker button.on{outline:3px solid var(--green);outline-offset:-3px}
.picker button.on .tick{background:var(--green);color:#fff}
.dev-bar button,.edit-actions button{padding:9px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:600;font-size:14px}
.edit-actions button.primary{background:var(--green);color:#fff;border-color:var(--green)}
#editBox{padding:10px 16px 0;overflow-y:auto}
.edit-prev{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--bg)}
.edit-where{margin:10px 2px 8px;font-size:15px}
.edit-where small{color:var(--muted)}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.edit-list{padding:4px 0 24px}
.edit-list a.here{background:var(--green-2)}
.edit-h{font:700 20px Fraunces,serif;color:var(--green);margin:4px 0 10px}
.edit-help{padding-left:20px;font-size:14.5px;margin:0 0 12px}
#editBox .empty{padding:20px;color:var(--muted);text-align:center}
#editBox .gallery{margin-bottom:24px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:48px;height:48px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.fab.show{opacity:1;transform:none;pointer-events:auto}
.fab svg{width:20px;height:20px}
@media (min-width:700px){.card-head{padding:24px 26px 6px}.card-body{padding:4px 26px 24px}.more{width:calc(100% - 52px);margin:0 26px 24px}.gallery{grid-template-columns:repeat(3,1fr)}.gallery.odd button:first-child{grid-column:auto;aspect-ratio:1}}
</style>
</head>
<body>
<header class="hero">
  <img src="logo.png" alt="Logo ZPiT Suszanie">
  <div class="kicker">Zespół Pieśni i Tańca</div>
  <h1>Kronika Suszanie</h1>
  <p>Bale, występy, zgrupowania i wszystko, co razem przetańczyliśmy.</p>
  <div class="stats" id="stats"></div>
</header>
<nav class="bar"><div class="bar-in">
  <div class="years" id="years" role="tablist"></div>
  <button class="menu-btn" id="menuBtn" aria-label="Spis treści"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Spis</button>
</div></nav>
<main id="main"></main>

<div id="tocWrap">
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" aria-label="Spis treści">
    <div class="drawer-top"><div class="grip"></div><input class="search" id="search" type="search" placeholder="Szukaj: bal, Rzeszów, zgrupowanie…" autocomplete="off"></div>
    <div class="toc" id="toc"></div>
  </aside>
</div>

<div id="editWrap">
  <div class="scrim" id="editScrim"></div>
  <aside class="drawer" id="editBox" aria-label="Edycja zdjęcia"></aside>
</div>
<div class="toast" id="toast" role="status"></div>

<div class="lb" id="lb" aria-hidden="true">
  <div class="lb-track" id="lbTrack"></div>
  <div class="lb-ui"><span id="lbCount"></span><button id="lbClose" aria-label="Zamknij">✕</button></div>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Poprzednie">‹</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Następne">›</button>
</div>
<button class="fab" id="fab" aria-label="Do góry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>

<script>const DATA=/*__DATA__*/null;</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  // BASE = kronika jak w Google Docs; years = po zmianach kronikarza (photos.json: zdjęcia, skład, nowe wpisy)
  const BASE = DATA.years;
  BASE.forEach(y => y.sections.forEach((s, i) => {
    s.id = `${y.year}-${i + 1}`; s.key = `${y.year}|${s.title}`;
    s.blocks.forEach(([k, v]) => k === "gallery" && v.forEach(im => im.home = s.key));
  }));
  // tryb edycji tylko dla kronikarza: hasło przy wejściu (5× stuknij logo albo adres z ?edytuj)
  const PASS = "1234";
  let DEV = (() => { try { return localStorage.getItem("kronika-dev") === "1"; } catch { return false; } })();
  const normEdits = d => ({...d, moves: d.moves || {}, members: d.members || {}, posts: d.posts || [], sections: d.sections || {}});
  let edits = normEdits(DATA.edits || {}), hidden = [];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const strip = s => s.replace(/<[^>]+>/g, "");
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ł/g, "l");
  const textBlocks = t => (t || "").split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => ["text", esc(p).replace(/\n/g, "<br>")]);
  let years = materialize();

  function materialize() {
    const ys = BASE.map(y => ({...y, members: [...y.members], sections: y.sections.map(s => ({...s, blocks: s.blocks.map(([k, v]) => [k, k === "gallery" ? [...v] : v])}))}));
    for (const p of edits.posts) if (!ys.some(y => y.year === p.year)) ys.push({year: p.year, members: [], covers: [], sections: []});
    ys.sort((a, b) => a.year.localeCompare(b.year));
    // skład zespołu
    for (const y of ys) {
      const m = edits.members[y.year]; if (!m) continue;
      y.members = y.members.filter(n => !(m.remove || []).includes(n)).map(n => (m.rename || {})[n] || n);
      for (const a of m.add || []) if (!y.members.includes(a)) y.members.push(a);
    }
    // poprawki wpisów z Google Docs: tytuł, data, tekst, ukrycie
    for (const y of ys) for (const s of y.sections) {
      const ov = edits.sections[s.key]; if (!ov) continue;
      if (ov.title != null) s.title = ov.title;
      if (ov.date != null) s.date = ov.date;
      if (ov.text != null) {
        const ims = s.blocks.filter(b => b[0] === "gallery").flatMap(b => b[1]);
        s.blocks = [...textBlocks(ov.text), ...(ims.length ? [["gallery", ims]] : [])];
      }
      s.edited = true;
      if (ov.hidden) s.hiddenEntry = true;
    }
    // nowe wpisy kronikarza
    for (const p of edits.posts) {
      const y = ys.find(x => x.year === p.year);
      const sec = {id: `${p.year}-p${p.id}`, key: `${p.year}|post:${p.id}`, post: p, title: p.title, date: p.date || "", blocks: [...textBlocks(p.text), ...(p.videos || []).map(v => ["video", v])]};
      let i = y.sections.length;
      if (p.after === "start") i = 0;
      else if (p.after) { const j = y.sections.findIndex(s => s.key === p.after); if (j >= 0) i = j + 1; }
      while (p.after && y.sections[i] && y.sections[i].post) i++;
      y.sections.splice(i, 0, sec);
    }
    // przenosiny zdjęć
    const byKey = {}, imgs = {};
    ys.forEach(y => y.sections.forEach(s => { byKey[s.key] = s; s.blocks.forEach(([k, v]) => k === "gallery" && v.forEach(im => imgs[im.id] = im)); }));
    const moves = edits.moves;
    const moving = Object.keys(moves).filter(id => imgs[id] && (moves[id] === "hidden" || byKey[moves[id]]));
    const out = new Set(moving);
    ys.forEach(y => y.sections.forEach(s => {
      s.blocks = s.blocks.map(([k, v]) => [k, k === "gallery" ? v.filter(im => !out.has(im.id)) : v]).filter(([k, v]) => k !== "gallery" || v.length);
    }));
    hidden = [];
    for (const id of moving) {
      if (moves[id] === "hidden") { hidden.push(imgs[id]); continue; }
      const b = byKey[moves[id]].blocks, last = b[b.length - 1];
      if (last && last[0] === "gallery") last[1].push(imgs[id]); else b.push(["gallery", [imgs[id]]]);
    }
    ys.forEach(y => y.sections = y.sections.filter(s => (s.blocks.length || s.post) && (!s.hiddenEntry || DEV)));
    return ys.filter(y => y.sections.length || y.members.length);
  }

  // statystyki i zakładki lat
  function renderTop() {
    const nSec = years.reduce((a, y) => a + y.sections.length, 0);
    const nImg = years.reduce((a, y) => a + y.sections.reduce((b, s) => b + s.blocks.filter(x => x[0] === "gallery").reduce((c, g) => c + g[1].length, 0), 0), 0);
    $("#stats").innerHTML = `<span class="stat"><b>${years.length}</b> ${years.length === 1 ? "rok" : "lata"}</span><span class="stat"><b>${nSec}</b> wpisów</span><span class="stat"><b>${nImg}</b> zdjęć</span>`;
    $("#years").innerHTML = years.map(y => `<button class="year-btn" role="tab" data-y="${y.year}"${current && current.year === y.year ? ` aria-current="true"` : ""}>${y.year || "Kronika"}</button>`).join("");
  }
  $("#years").addEventListener("click", e => { const b = e.target.closest(".year-btn"); if (b) go(b.dataset.y, true); });

  let current = null, lbImgs = [];
  renderTop();

  function renderYear(y) {
    lbImgs = [];
    const idx = years.indexOf(y);
    const gallery = imgs => {
      const start = lbImgs.length; lbImgs.push(...imgs);
      const show = DEV ? imgs : imgs.slice(0, 5), cls = imgs.length === 1 ? "one" : (show.length % 2 ? "odd" : "");

      return `<article class="entry" id="${s.id}"><div class="card${fold ? " collapsed" : ""}${s.hiddenEntry ? " ghost" : ""}">
        <div class="card-head"><span class="date${s.date ? "" : " nodate"}">${s.date ? esc(s.date) : "✦ " + y.year}</span><h3>${esc(s.title)}</h3>

        <div class="card-body">${body}</div>${fold ? `<button class="more">Czytaj dalej</button>` : ""}</div></article>`;
    }).join("") + `</div>`;
    if (idx < years.length - 1) h += `<button class="next-year" data-y="${years[idx + 1].year}">Dalej: rok ${years[idx + 1].year} →</button>`;
    else if (idx > 0) h += `<button class="next-year" data-y="${years[0].year}">← Wróć do roku ${years[0].year}</button>`;
    h += `<p class="updated">Kronikarz: Filip Jiravský · aktualizacja ${new Date(DATA.updated).toLocaleString("pl-PL", {day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"})}<br><a href="https://www.facebook.com/Suszanie" target="_blank" rel="noopener">Facebook</a> · <a href="https://www.instagram.com/zpitsuszanie/" target="_blank" rel="noopener">Instagram</a></p>`;
    $("#main").innerHTML = h;
  }

  function go(year, scrollTop, sectionId) {
    const y = years.find(x => x.year === year) || years[years.length - 1];
    if (current !== y) { current = y; renderYear(y); }
    document.querySelectorAll(".year-btn").forEach(b => {
      const on = b.dataset.y === y.year; b.setAttribute("aria-current", on);
      if (on) b.scrollIntoView({inline: "center", block: "nearest"});
    });
    history.replaceState(null, "", "#" + (sectionId || y.year));
    if (sectionId) requestAnimationFrame(() => document.getElementById(sectionId)?.scrollIntoView({behavior: "smooth"}));
    else if (scrollTop) window.scrollTo({top: $("#main").offsetTop - 60, behavior: "smooth"});
  }

  $("#main").addEventListener("click", e => {
    const more = e.target.closest(".more");
    if (more) { more.previousElementSibling.parentElement.classList.remove("collapsed"); more.remove(); return; }
    const ny = e.target.closest(".next-year");
    if (ny) return go(ny.dataset.y, true);
    const g = e.target.closest(".gallery button");
    if (g) return DEV ? openEdit(g.dataset.id) : openLb(+g.dataset.i);
    const mb = e.target.closest("[data-member]");
    if (mb) { e.preventDefault(); return openMember(current.year, mb.dataset.member); }
    const eb = e.target.closest("[data-entry]");
    if (eb) { const s = current.sections.find(x => x.key === eb.dataset.entry); return s.post ? openPost(s.post) : openDocEntry(s); }
    const d = e.target.closest("[data-dev]");
    if (!d) return;
    if (d.dataset.dev === "hidden") openHidden();
    if (d.dataset.dev === "post") openPost(null);
    if (d.dataset.dev === "off") { try { localStorage.removeItem("kronika-dev"); } catch {} DEV = false; refresh(); }
  });

  // spis treści
  const tocWrap = $("#tocWrap");
  function renderToc(q = "") {
    const nq = norm(q.trim());
    let h = "";
    for (const y of [...years].reverse()) {
      const items = y.sections.filter(s => !nq || norm(s.title + " " + s.date + " " + strip(s.blocks.filter(b => b[0] === "text").map(b => b[1]).join(" "))).includes(nq));
      if (items.length) h += `<h4>${y.year}</h4>` + items.map(s => `<a href="#${s.id}" data-y="${y.year}" data-s="${s.id}"><small>${s.date ? esc(s.date) : "✦"}</small><span>${esc(s.title)}</span></a>`).join("");
    }
    $("#toc").innerHTML = h || `<div class="empty">Nic nie znaleziono 🤷</div>`;
  }
  const openToc = () => { renderToc($("#search").value); tocWrap.classList.add("open"); };
  const closeToc = () => tocWrap.classList.remove("open");
  $("#menuBtn").onclick = openToc;
  $("#scrim").onclick = closeToc;
  $("#search").oninput = e => renderToc(e.target.value);
  $("#toc").addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); closeToc(); go(a.dataset.y, false, a.dataset.s); });
  let ty0 = null;
  $(".drawer-top").addEventListener("touchstart", e => ty0 = e.touches[0].clientY, {passive: true});
  $(".drawer-top").addEventListener("touchend", e => { if (ty0 !== null && e.changedTouches[0].clientY - ty0 > 60) closeToc(); ty0 = null; });

  // galeria pełnoekranowa
  const lb = $("#lb"), track = $("#lbTrack");
  let li = 0;
  function openLb(i) {
    track.innerHTML = lbImgs.map(im => `<div class="lb-slide"><img data-src="${im.src}" alt=""></div>`).join("");
    lb.classList.add("show"); lb.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden";
    show(i, false);
  }
  function show(i, anim = true) {
    li = Math.max(0, Math.min(lbImgs.length - 1, i));
    track.style.transition = anim ? "" : "none";
    track.style.transform = `translateX(${-li * 100}%)`;
    [li - 1, li, li + 1].forEach(k => { const im = track.children[k]?.querySelector("img"); if (im && !im.src) im.src = im.dataset.src; });
    $("#lbCount").textContent = `${li + 1} / ${lbImgs.length}`;
  }
  function closeLb() { lb.classList.remove("show"); lb.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }
  $("#lbClose").onclick = closeLb;
  $("#lbPrev").onclick = () => show(li - 1);
  $("#lbNext").onclick = () => show(li + 1);
  let sx = null, sy = null, dx = 0;
  lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; track.style.transition = "none"; }, {passive: true});
  lb.addEventListener("touchmove", e => { if (sx === null) return; dx = e.touches[0].clientX - sx; track.style.transform = `translateX(calc(${-li * 100}% + ${dx}px))`; }, {passive: true});
  lb.addEventListener("touchend", e => {
    if (sx === null) return;
    const dy = e.changedTouches[0].clientY - sy; sx = null; track.style.transition = "";
    if (Math.abs(dy) > 110 && Math.abs(dy) > Math.abs(dx)) return closeLb();
    show(dx < -50 ? li + 1 : dx > 50 ? li - 1 : li);
  });
  document.addEventListener("keydown", e => {
    if (lb.classList.contains("show")) { if (e.key === "Escape") closeLb(); if (e.key === "ArrowLeft") show(li - 1); if (e.key === "ArrowRight") show(li + 1); }
    else if (e.key === "Escape") { closeToc(); closeEdit(); }
  });

  // przycisk do góry
  const fab = $("#fab");
  addEventListener("scroll", () => fab.classList.toggle("show", scrollY > 900), {passive: true});
  fab.onclick = () => scrollTo({top: 0, behavior: "smooth"});

  // --- tryb kronikarza --------------------------------------------------------
  function refresh(toYear) {
    const y = toYear || (current && current.year), sy = scrollY;
    years = materialize(); current = null;
    const cy = years.find(x => x.year === y) || years[years.length - 1];
    current = cy; renderTop(); renderYear(cy);
    if (!toYear) scrollTo(0, sy);

  const toast = (msg, ms = 3500) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), ms); };
  const editWrap = $("#editWrap"), editBox = $("#editBox");

  const findImg = id => allImgs().find(x => x.id === id);
  const placeOf = id => { for (const y of years) for (const s of y.sections) for (const [k, v] of s.blocks) if (k === "gallery" && v.some(x => x.id === id)) return s; };
  const titleOfKey = key => { for (const y of years) for (const s of y.sections) if (s.key === key) return s.title; return key.split("|").slice(1).join("|"); };

  // każda zmiana = funkcja na obiekcie zmian; wykonuje się lokalnie i na świeżym photos.json z GitHuba
  function commit(fn, msg, toYear, scrollId) {

  }

  function askPassword() {
    openSheet(`<h4 class="edit-h">Tryb kronikarza</h4>
      <input class="search" id="passIn" type="password" inputmode="numeric" placeholder="Hasło" autocomplete="off">
      <div class="edit-actions" style="margin-top:12px"><button data-act="pass" class="primary">Wejdź</button></div>`,
      e => { if (e.target.closest("[data-act=pass]")) tryIt(); });

  }
  let taps = 0, tapT;

  if (!DEV && new URLSearchParams(location.search).has("edytuj")) askPassword();

  // zdjęcie: przenieś / ukryj / przywróć
  function openEdit(id) {
    const im = findImg(id), place = placeOf(id), isHidden = edits.moves[id] === "hidden";
    const moved = edits.moves[id] && edits.moves[id] !== im.home;
    openSheet(`<img class="edit-prev" src="${im.src}" alt="">
      <p class="edit-where">${isHidden ? "Zdjęcie jest <b>ukryte</b>." : `Teraz w: <b>${esc(place ? place.title : "?")}</b>`}${moved ? `<br><small>Oryginalnie: ${esc(titleOfKey(im.home))}</small>` : ""}</p>
      <div class="edit-actions">
        ${isHidden ? `<button data-act="show">Pokaż z powrotem</button>` : `<button data-act="hide">Ukryj zdjęcie</button>`}
        ${moved ? `<button data-act="home">Przywróć na oryginalne miejsce</button>` : ""}
      </div>
      <input class="search" id="editSearch" type="search" placeholder="Przenieś do… (szukaj wpisu)" autocomplete="off">
      <div class="toc edit-list" id="editList"></div>`, e => {
      const a = e.target.closest("[data-to]"), act = e.target.closest("[data-act]");
      if (a) { e.preventDefault(); setMove(id, a.dataset.to, `Przeniesiono do: ${titleOfKey(a.dataset.to)}`); }
      else if (act) setMove(id, act.dataset.act === "hide" ? "hidden" : im.home, act.dataset.act === "hide" ? "Zdjęcie ukryte" : "Zdjęcie wróciło na miejsce");
    });
    const list = q => {
      const nq = norm(q.trim());
      $("#editList").innerHTML = [...years].reverse().map(y => {
        const it = y.sections.filter(s => !nq || norm(s.title + " " + s.date).includes(nq));
        return it.length ? `<h4>${y.year}</h4>` + it.map(s => `<a href="#" data-to="${esc(s.key)}"${place && place.key === s.key ? ` class="here"` : ""}><small>${s.date ? esc(s.date) : "✦"}</small><span>${esc(s.title)}</span></a>`).join("") : "";
      }).join("") || `<div class="empty">Nic nie znaleziono</div>`;
    };
    list("");
    $("#editSearch").oninput = e => list(e.target.value);
  }

  function openHidden() {
    openSheet(`<h4 class="edit-h">Ukryte zdjęcia</h4>` + (hidden.length
      ? `<div class="gallery">${hidden.map(im => `<button data-hid="${im.id}"><img src="${im.src}" alt=""></button>`).join("")}</div>`
      : `<div class="empty">Brak ukrytych zdjęć</div>`),
      e => { const b = e.target.closest("[data-hid]"); if (b) openEdit(b.dataset.hid); });
  }

  function setMove(id, target, msg) {
    const home = findImg(id).home;
    commit(d => { if (target === home) delete d.moves[id]; else d.moves[id] = target; }, msg);
  }

  // skład zespołu: popraw / usuń / dodaj osobę (zmiany per rok, oryginał zostaje w Google Docs)
  function openMember(year, name) {
    const isNew = !name;
    openSheet(`<h4 class="edit-h">${isNew ? `Dodaj osobę – ${year}` : "Osoba w składzie"}</h4>
      <input class="search" id="memIn" type="text" placeholder="Imię i nazwisko" value="${esc(name)}" autocomplete="off">
      <div class="edit-actions" style="margin-top:12px">
        <button data-act="ok" class="primary">${isNew ? "Dodaj" : "Zapisz zmianę"}</button>
        ${isNew ? "" : `<button data-act="del" class="danger">Usuń ze składu ${year}</button>`}
      </div>`, e => {
      const act = e.target.closest("[data-act]"); if (!act) return;
      const v = $("#memIn").value.trim().replace(/\s+/g, " ");
      if (act.dataset.act === "del") return commit(d => memberOp(d, year, "remove", name), `Usunięto ze składu: ${name}`);
      if (!v || v === name) return closeEdit();
      if (isNew) commit(d => memberOp(d, year, "add", v), `Dodano do składu: ${v}`);
      else commit(d => memberOp(d, year, "rename", name, v), `Poprawiono: ${name} → ${v}`);
    });
    setTimeout(() => { const i = $("#memIn"); i.focus(); i.onkeydown = e => { if (e.key === "Enter") editBox.querySelector("[data-act=ok]").click(); }; }, 300);
  }
  function memberOp(d, year, op, name, to) {
    const m = d.members[year] = d.members[year] || {};
    m.add = m.add || []; m.remove = m.remove || []; m.rename = m.rename || {};
    const orig = Object.keys(m.rename).find(k => m.rename[k] === name) || name;  // nazwa z Google Docs
    if (op === "add") { if (m.remove.includes(name)) m.remove = m.remove.filter(n => n !== name); else if (!m.add.includes(name)) m.add.push(name); }
    if (op === "remove") { if (m.add.includes(name)) m.add = m.add.filter(n => n !== name); else { m.remove.push(orig); delete m.rename[orig]; } }
    if (op === "rename") { if (m.add.includes(name)) m.add = m.add.map(n => n === name ? to : n); else if (to === orig) delete m.rename[orig]; else m.rename[orig] = to; }
  }

  // nowy wpis / edycja wpisu: tytuł, data, tekst, miejsce w kronice, zdjęcia wybrane z kroniki
  let draft = null;
  function openPost(post) {
    const key = post ? `${post.year}|post:${post.id}` : null;
    draft = post ? {...post, photos: Object.keys(edits.moves).filter(id => edits.moves[id] === key)}
      : {id: Date.now().toString(36), year: current.year, date: "", title: "", text: "", after: "", photos: [], isNew: true};
    postForm();
  }
  function readForm() {
    const f = id => editBox.querySelector("#" + id);
    if (!f("pTitle")) return;
    draft.year = f("pYear").value.trim() || draft.year; draft.date = f("pDate").value.trim(); draft.title = f("pTitle").value.trim();
    draft.text = f("pText").value; draft.after = f("pAfter").value;
  }
  function postForm() {
    const y = years.find(x => x.year === draft.year);
    const secs = y ? y.sections.filter(s => !(s.post && s.post.id === draft.id)) : [];
    const thumbs = draft.photos.map(id => findImg(id)).filter(Boolean);
    openSheet(`<h4 class="edit-h">${draft.isNew ? "Nowy wpis" : "Edytuj wpis"}</h4>
      <div class="form">
        <label>Rok<input id="pYear" class="search" inputmode="numeric" value="${esc(draft.year)}"></label>
        <label>Data <small>(opcjonalnie, np. 12.11)</small><input id="pDate" class="search" value="${esc(draft.date)}"></label>
        <label>Tytuł<input id="pTitle" class="search" value="${esc(draft.title)}" placeholder="np. Wyjazd do Wisły"></label>
        <label>Tekst <small>(pusta linijka = nowy akapit)</small><textarea id="pText" class="search" rows="8">${esc(draft.text)}</textarea></label>
        <label>Gdzie w kronice<select id="pAfter" class="search">
          <option value="">Na końcu roku ${esc(draft.year)}</option>
          <option value="start"${draft.after === "start" ? " selected" : ""}>Na początku roku</option>
          ${secs.map(s => `<option value="${esc(s.key)}"${draft.after === s.key ? " selected" : ""}>Po: ${esc((s.date ? s.date + " " : "") + s.title)}</option>`).join("")}
        </select></label>
        <div class="label">Zdjęcia (${thumbs.length})</div>
        ${thumbs.length ? `<div class="gallery">${thumbs.map(im => `<button data-pick="${im.id}" title="Usuń z wpisu"><img src="${im.src}" alt=""><span class="x">✕</span></button>`).join("")}</div>` : ""}
        <div class="edit-actions"><button data-act="pick">+ Wybierz zdjęcia z kroniki</button></div>
        ${(draft.videos || []).length ? `<div class="label">Wideo</div>${draft.videos.map(v => `<div class="edit-actions"><span class="tag">🎬 ${esc(v.split("/").pop())}</span><button data-vid="${esc(v)}" class="danger">Usuń wideo z wpisu</button></div>`).join("")}` : ""}
      </div>
      <div class="edit-actions sticky">
        <button data-act="save" class="primary">${draft.isNew ? "Dodaj wpis" : "Zapisz"}</button>
        ${draft.isNew ? "" : `<button data-act="delpost" class="danger">Usuń wpis</button>`}
      </div>`, e => {
      const act = e.target.closest("[data-act]"), pk = e.target.closest("[data-pick]");
      if (pk) { readForm(); draft.photos = draft.photos.filter(x => x !== pk.dataset.pick); return postForm(); }
      const vb = e.target.closest("[data-vid]");
      if (vb) { readForm(); draft.videos = draft.videos.filter(v => v !== vb.dataset.vid); return postForm(); }
      if (!act) return;
      readForm();
      if (act.dataset.act === "pick") return photoPicker();
      if (act.dataset.act === "delpost") {
        if (!confirm(`Usunąć wpis „${draft.title}”? Zdjęcia wrócą na swoje miejsca.`)) return;
        const id = draft.id, k = `${draft.year}|post:${id}`;
        return commit(d => { d.posts = d.posts.filter(p => p.id !== id); for (const x of Object.keys(d.moves)) if (d.moves[x] === k || d.moves[x].endsWith(`|post:${id}`)) delete d.moves[x]; }, `Usunięto wpis: ${draft.title}`);
      }
      if (!/^\d{4}$/.test(draft.year)) return toast("Rok musi mieć 4 cyfry");
      if (!draft.title) return toast("Wpisz tytuł");
      const p = {id: draft.id, year: draft.year, date: draft.date, title: draft.title, text: draft.text.trim(), after: draft.after};
      if (draft.videos && draft.videos.length) p.videos = draft.videos;
      const k = `${p.year}|post:${p.id}`, photos = [...draft.photos];
      commit(d => {
        const i = d.posts.findIndex(x => x.id === p.id);
        if (i >= 0) d.posts[i] = p; else d.posts.push(p);
        for (const x of Object.keys(d.moves)) if (d.moves[x].endsWith(`|post:${p.id}`) && !photos.includes(x)) delete d.moves[x];
        for (const x of photos) d.moves[x] = k;
      }, `${draft.isNew ? "Dodano" : "Zapisano"} wpis: ${p.title}`, p.year, `${p.year}-p${p.id}`);
    });
    editBox.querySelector("#pYear").onchange = () => { readForm(); draft.after = ""; postForm(); };
  }
  // tekst z HTML kroniki → zwykły tekst do edycji
  const htmlToText = blocks => blocks.filter(b => b[0] === "text").map(b => {
    const d = document.createElement("div"); d.innerHTML = b[1].replace(/<br\s*\/?>/g, "\n"); return d.textContent.trim();
  }).join("\n\n");
  const baseSection = key => { for (const y of BASE) for (const s of y.sections) if (s.key === key) return s; };
  const photosIn = s => s.blocks.filter(b => b[0] === "gallery").flatMap(b => b[1]).map(im => im.id);

  function openDocEntry(s) {
    draft = {doc: s.key, year: s.key.split("|")[0], date: s.date, title: s.title, text: htmlToText(s.blocks), photos: photosIn(s), initial: photosIn(s)};
    docForm();
  }
  function docForm() {
    const key = draft.doc, ov = edits.sections[key] || {};
    const thumbs = draft.photos.map(id => findImg(id)).filter(Boolean);
    openSheet(`<h4 class="edit-h">Edytuj wpis</h4>
      <p class="edit-where"><small>Ten wpis pochodzi z Google Docs. Zmiany tutaj zmieniają tylko stronę – dokument zostaje bez zmian.
        ${ov.text != null ? "<br><b>Uwaga:</b> tekst jest poprawiony na stronie, więc późniejsze zmiany tekstu w dokumencie nie będą tu widoczne, dopóki nie klikniesz „Przywróć wersję z dokumentu”." : ""}</small></p>
      <div class="form">
        <label>Data <small>(np. 12.11)</small><input id="pDate" class="search" value="${esc(draft.date)}"></label>
        <label>Tytuł<input id="pTitle" class="search" value="${esc(draft.title)}"></label>
        <label>Tekst <small>(pusta linijka = nowy akapit; pogrubienia z dokumentu znikną, jeśli zmienisz tekst)</small><textarea id="pText" class="search" rows="10">${esc(draft.text)}</textarea></label>
        <div class="label">Zdjęcia (${thumbs.length})</div>
        ${thumbs.length ? `<div class="gallery">${thumbs.map(im => `<button data-pick="${im.id}" title="Usuń z wpisu"><img src="${im.src}" alt=""><span class="x">✕</span></button>`).join("")}</div>` : ""}
        <div class="edit-actions"><button data-act="pick">+ Wybierz zdjęcia z kroniki</button></div>
        <div class="edit-actions">
          ${ov.hidden ? `<button data-act="show">Pokaż wpis z powrotem</button>` : `<button data-act="hide" class="danger">Ukryj wpis</button>`}
          ${Object.keys(ov).length ? `<button data-act="reset">Przywróć wersję z dokumentu</button>` : ""}
        </div>
      </div>
      <div class="edit-actions sticky"><button data-act="save" class="primary">Zapisz</button></div>`, e => {
      const act = e.target.closest("[data-act]"), pk = e.target.closest("[data-pick]");
      const f = id => editBox.querySelector("#" + id);
      const read = () => { draft.date = f("pDate").value.trim(); draft.title = f("pTitle").value.trim(); draft.text = f("pText").value; };
      if (pk) { read(); draft.photos = draft.photos.filter(x => x !== pk.dataset.pick); return docForm(); }
      if (!act) return;
      read();
      const title = draft.title || baseSection(key).title;
      const tidy = d => { if (d.sections[key] && !Object.keys(d.sections[key]).length) delete d.sections[key]; };
      if (act.dataset.act === "pick") return photoPicker();
      if (act.dataset.act === "hide") return commit(d => { d.sections[key] = {...(d.sections[key] || {}), hidden: true}; }, `Ukryto wpis: ${title}`);
      if (act.dataset.act === "show") return commit(d => { if (d.sections[key]) delete d.sections[key].hidden; tidy(d); }, `Wpis znów widoczny: ${title}`);
      if (act.dataset.act === "reset") {
        if (!confirm("Przywrócić tytuł, datę i tekst z Google Docs? (zdjęcia zostają jak są)")) return;
        return commit(d => { delete d.sections[key]; }, `Przywrócono z dokumentu: ${title}`);
      }
      if (!draft.title) return toast("Wpisz tytuł");
      // zapisujemy tylko to, co różni się od dokumentu – reszta dalej idzie z Google Docs
      const orig = baseSection(key), ch = {};
      if (draft.title !== orig.title) ch.title = draft.title;
      if (draft.date !== orig.date) ch.date = draft.date;
      if (draft.text.trim() !== htmlToText(orig.blocks)) ch.text = draft.text.trim();
      const photos = [...draft.photos], initial = draft.initial;
      commit(d => {
        const keepHidden = d.sections[key] && d.sections[key].hidden;
        d.sections[key] = {...ch, ...(keepHidden ? {hidden: true} : {})}; tidy(d);
        for (const x of photos) { if (findImg(x).home === key) delete d.moves[x]; else d.moves[x] = key; }
        for (const x of initial) if (!photos.includes(x)) { if (findImg(x).home === key) d.moves[x] = "hidden"; else delete d.moves[x]; }
      }, `Zapisano wpis: ${draft.title}`);
    });
  }

  function photoPicker() {
    const sel = new Set(draft.photos);
    const groups = [...BASE].reverse().map(y => {
      const ims = y.sections.flatMap(s => s.blocks.filter(b => b[0] === "gallery").flatMap(b => b[1]));
      return ims.length ? `<h4>${y.year}</h4><div class="gallery picker">${ims.map(im => `<button data-sel="${im.id}" class="${sel.has(im.id) ? "on" : ""}"><img src="${im.src}" loading="lazy" alt=""><span class="tick">✓</span></button>`).join("")}</div>` : "";
    }).join("");
    openSheet(`<h4 class="edit-h">Wybierz zdjęcia</h4><p class="edit-where"><small>Zaznaczone zdjęcia przeniosą się do tego wpisu.</small></p>
      <div class="toc">${groups}</div>
      <div class="edit-actions sticky"><button data-act="done" class="primary">Gotowe (<span id="selN">${sel.size}</span>)</button></div>`, e => {
      const b = e.target.closest("[data-sel]");
      if (b) { const id = b.dataset.sel; sel.has(id) ? sel.delete(id) : sel.add(id); b.classList.toggle("on"); $("#selN").textContent = sel.size; return; }
      if (e.target.closest("[data-act=done]")) { draft.photos = [...sel]; draft.doc ? docForm() : postForm(); }
    });
  }

  // zapis do photos.json w repozytorium przez API GitHuba (token tylko w tej przeglądarce)
  const getToken = () => { try { return localStorage.getItem("kronika-token"); } catch { return null; } };
  const api = (path, opt = {}) => fetch(`https://api.github.com/repos/${DATA.repo}/contents/${path}`, {...opt, cache: "no-store",
    headers: {Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json", ...(opt.headers || {})}});
  const b64e = s => btoa(unescape(encodeURIComponent(s)));
  const b64d = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
  let queue = Promise.resolve();
  function save(fn, msg) {
    if (!getToken()) return askToken(() => save(fn, msg));
    toast("Zapisuję…", 20000);
    queue = queue.then(async () => {
      for (let attempt = 0; attempt < 3; attempt++) {
        const r = await api("photos.json?ref=main");
        if (r.status === 401 || r.status === 403) { try { localStorage.removeItem("kronika-token"); } catch {} toast("Token nie działa – wklej nowy."); return askToken(() => save(fn, msg)); }
        const cur = r.ok ? await r.json() : null;
        const data = normEdits(cur ? JSON.parse(b64d(cur.content)) : {});
        fn(data);
        const put = await api("photos.json", {method: "PUT", body: JSON.stringify({
          message: `Kronikarz: ${msg}`, branch: "main", sha: cur ? cur.sha : undefined,
          content: b64e(JSON.stringify(data, null, 2) + "\n")})});
        if (put.ok) return toast(`✓ ${msg}. U wszystkich za ok. 2 min.`, 5000);
        if (put.status !== 409 && put.status !== 422) break;
      }
      toast("Nie udało się zapisać – spróbuj jeszcze raz.", 6000);
    }).catch(() => toast("Brak internetu – nie zapisano.", 6000));
  }

  function askToken(then) {
    openSheet(`<h4 class="edit-h">Połącz z GitHubem (jednorazowo)</h4>
      <ol class="edit-help"><li>Otwórz <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">tworzenie tokenu na GitHubie</a>.</li>
      <li><b>Repository access</b> → <i>Only select repositories</i> → <b>kronika-suszanie</b>.</li>
      <li><b>Permissions</b> → <b>Contents</b> → <i>Read and write</i>. Ustaw długi termin ważności.</li>
      <li>Kliknij <i>Generate token</i>, skopiuj i wklej tutaj:</li></ol>
      <input class="search" id="tokenIn" type="password" placeholder="github_pat_…" autocomplete="off">
      <div class="edit-actions" style="margin-top:12px"><button data-act="tok" class="primary">Zapisz w tym telefonie</button></div>`, e => {
      if (!e.target.closest("[data-act=tok]")) return;
      const v = $("#tokenIn").value.trim(); if (!v) return;
      try { localStorage.setItem("kronika-token", v); } catch {}
      closeEdit(); then();
    });
  }

  function loadEdits() {  // świeży photos.json, zanim GitHub przebuduje stronę
    if (!DEV || !getToken()) return;
    api("photos.json?ref=main").then(r => r.ok ? r.json() : null).then(f => {
      if (f) { edits = normEdits(JSON.parse(b64d(f.content))); refresh(); }
    }).catch(() => {});
  }
  loadEdits();

  // start: rok z adresu albo najnowszy
  function fromHash() {
    const hash = decodeURIComponent(location.hash.slice(1));
    const hy = hash.split("-")[0];
    go(years.some(y => y.year === hy) ? hy : years[years.length - 1].year, false, hash.includes("-") ? hash : null);
  }
  addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
